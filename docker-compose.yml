

services:
  postgres:
    image: postgres:15
    container_name: pg_ecommerce
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_ecommerce
    restart: always
    ports:
      - "5672:5672"       # AMQP port for NestJS
      - "15672:15672"     # Web UI (Rabbit Dashboard)
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin

volumes:
  pgdata:
